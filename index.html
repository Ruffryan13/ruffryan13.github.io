<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Content Editor</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 120px; margin-bottom: 10px; }
    button { padding: 10px 16px; cursor: pointer; }
    #output { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <h2>AI Content Rewriter</h2>
  
  <label for="userText">Original Text:</label>
  <textarea id="userText" placeholder="Paste your draft text here..."></textarea>
  
  <button onclick="editContent()">Improve Text with AI</button>

  <h3>Edited Result:</h3>
  <div id="output">Your edited text will appear here...</div>

  <script>
    async function editContent() {
      const text = document.getElementById("userText").value;
      const outputDiv = document.getElementById("output");
      
      // Prompt the user for their API key (avoids hardcoding sensitive keys in static JS)
      let apiKey = localStorage.getItem("GEMINI_API_KEY");
      if (!apiKey) {
        apiKey = prompt("Please enter your Gemini API Key:");
        if (apiKey) localStorage.setItem("GEMINI_API_KEY", apiKey);
        else return;
      }

      outputDiv.innerText = "Editing...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `Please proofread, improve clarity, and edit the following text:\n\n${text}` }]
            }]
          })
        });

        const data = await response.json();
        const editedText = data.candidates[0].content.parts[0].text;
        outputDiv.innerText = editedText;
      } catch (err) {
        outputDiv.innerText = "Error: " + err.message;
      }
    }
  </script>

</body>
</html>
