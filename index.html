<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141d">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="A personal control center for websites, notes, email, and connected tools.">
    <title>Control Center</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-page="Overview" aria-label="Control Center home">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>Control Center</span>
        </a>
        <p class="nav-label">WORKSPACE</p>
        <nav class="navigation" aria-label="Main navigation">
          <button class="nav-item active" data-page="Overview"><span aria-hidden="true">⌂</span>Overview</button>
          <button class="nav-item" data-page="Passwords"><span aria-hidden="true">▣</span>Passwords</button>
          <button class="nav-item" data-page="Email"><span aria-hidden="true">✉</span>Email</button>
          <button class="nav-item" data-page="Websites"><span aria-hidden="true">◎</span>Websites</button>
          <button class="nav-item" data-page="Notes"><span aria-hidden="true">▤</span>Notes</button>
          <button class="nav-item" data-page="OpenBot"><span aria-hidden="true">✳</span>OpenBot</button>
          <button class="nav-item" data-page="Remote desktop"><span aria-hidden="true">▱</span>Remote desktop</button>
          <button class="nav-item" data-page="SSH terminal"><span aria-hidden="true">⌘</span>SSH terminal</button>
        </nav>
        <div class="sidebar-foot">
          <span class="status-dot"></span>
          <span>Private workspace</span>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="breadcrumbs"><span>Workspace</span><span class="crumb-separator">/</span><strong id="current-section">Overview</strong></div>
          <button class="install-button" id="install-button" hidden>Install app</button>
        </header>
        <section id="page-content" class="page-content" aria-live="polite"></section>
        <footer class="footer">Your control center · Notes stay in this browser on this device</footer>
      </main>
    </div>
  </body>
</html>
